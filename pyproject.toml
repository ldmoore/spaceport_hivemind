[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceport-hivemind"
version = "0.1.0"
description = "Centralized coordinator and thin game bridges for Spaceport Bazaar"
requires-python = ">=3.11"
dependencies = [
  "protobuf>=5.28,<7",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.66,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
hivemind-server = "spaceport_hivemind.server:main"
hivemind-client = "spaceport_hivemind.client:main"
hivemind-demo-server = "spaceport_hivemind.demo_server:main"
hivemind-demo = "spaceport_hivemind.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
